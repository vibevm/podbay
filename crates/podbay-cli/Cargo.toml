[package]
name = "podbay-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
podbay-host = { path = "../podbay-host" }
podbay-launch-linux = { path = "../podbay-launch-linux" }
podbay-pod = { path = "../podbay-pod" }
podbay-server = { path = "../podbay-server" }
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
podbay-store = { path = "../podbay-store" }
sha2 = "0.11"

[[bin]]
name = "podbay"
path = "src/main.rs"
