[package]
name = "podbay-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-compact = { version = "2", default-features = false }
getrandom = "0.4"
podbay-core = { path = "../podbay-core" }
podbay-store = { path = "../podbay-store" }
podbay-wire = { path = "../podbay-wire" }
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lib]
path = "src/lib.rs"
