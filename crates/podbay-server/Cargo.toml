[package]
name = "podbay-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "One-exchange authenticated PodBay protocol router"

[dependencies]
podbay-wire = { path = "../podbay-wire" }
podbay-host = { path = "../podbay-host" }
podbay-store = { path = "../podbay-store" }
podbay-core = { path = "../podbay-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
podbay-pod = { path = "../podbay-pod" }
libc = "0.2"

[dev-dependencies]
podbay-client = { path = "../podbay-client" }
ed25519-compact = { version = "2", default-features = false }
sha2 = "0.11"
