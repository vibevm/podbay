[package]
name = "podbay-r1-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Explicit ordinary-UID native syscall test executable; never installed.
native-test-probe = []

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
sha2 = "0.11"

[[bin]]
name = "podbay-r1-linux"
path = "src/main.rs"

[[bin]]
name = "podbay-r1-boot-producer"
path = "src/producer_main.rs"

[[bin]]
name = "podbay-r1-appliance-keeper"
path = "src/appliance_keeper_main.rs"

[[bin]]
name = "podbay-r1-appliance-custodian"
path = "src/appliance_custodian_main.rs"

[[bin]]
name = "podbay-r1-native-test-probe"
path = "src/bin/native_test_probe.rs"
required-features = ["native-test-probe"]
test = false
