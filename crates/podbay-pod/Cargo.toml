[package]
name = "podbay-pod"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
podbay-core = { path = "../podbay-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
libc = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "podbay-pod"
path = "src/main.rs"
