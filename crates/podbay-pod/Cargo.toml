[package]
name = "podbay-pod"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Opt-in only for disposable native recovery crash-window fixtures.
native-rebind-test-hook = []

[dependencies]
podbay-core = { path = "../podbay-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
podbay-adapter-codex = { path = "../podbay-adapter-codex" }
podbay-store = { path = "../podbay-store" }
podbay-wire = { path = "../podbay-wire" }
libc = "0.2"
nix = { version = "=0.28.0", features = ["socket"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "podbay-pod"
path = "src/main.rs"
