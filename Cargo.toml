[workspace]
resolver = "2"
members = [
  "crates/podbay-core",
  "crates/podbay-wire",
  "crates/podbay-store",
  "crates/podbay-host",
  "crates/podbay-launch-linux",
  "crates/podbay-pod",
  "crates/podbay-fd3-sys",
  "crates/podbay-macos-sys",
  "crates/podbay-win32",
  "crates/podbay-client",
  "crates/podbay-server",
  "crates/podbay-adapter-codex",
  "crates/podbay-cli",
  "crates/podbay-r1-linux",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UPL-1.0"

[profile.dev.package.sha2]
opt-level = 3
